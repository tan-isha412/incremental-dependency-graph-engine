plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.github.javaparser:javaparser-core:3.26.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Bundle the built React app (frontend/dist) as Spring Boot static content
// so the same jar serves both the API and the UI.
tasks.named('processResources') {
    from("${rootDir}/../frontend/dist") {
        into 'static'
    }
}

// Only produce the executable Spring Boot jar in build/libs (skip the plain,
// non-runnable jar) so Docker's `COPY *.jar` has exactly one match.
tasks.named('jar') {
    enabled = false
}